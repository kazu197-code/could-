<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>麻雀 卓立てカレンダー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: 月カレンダー（左）＋ 選んだ日の卓リスト（右）。狭い画面では縦積み。 */
:root {
  --bg: #eef1ec;         /* 淡い卓布グレー */
  --surface: #fbfaf5;    /* 牌の象牙色 */
  --line: #d5dbd2;
  --fg: #1d2a24;
  --muted: #5f6f67;
  --felt: #146b4a;       /* 麻雀マットの緑 */
  --felt-soft: #d7ebe0;
  --shu: #c0392b;        /* 朱（中・成立） */
  --shu-soft: #f6dcd8;
  --wait: #a06a12;
  --wait-soft: #f5e8cc;
  --tile-edge: #cfc8b4;
  --font-display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", sans-serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111814; --surface: #19221d; --line: #2c3a33; --fg: #e6ece8; --muted: #9aaba2;
    --felt: #3fb885; --felt-soft: #1d3a2d; --shu: #ef7a6c; --shu-soft: #3d2320;
    --wait: #e0b25a; --wait-soft: #3a2f18; --tile-edge: #3a463f; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111814; --surface: #19221d; --line: #2c3a33; --fg: #e6ece8; --muted: #9aaba2;
  --felt: #3fb885; --felt-soft: #1d3a2d; --shu: #ef7a6c; --shu-soft: #3d2320;
  --wait: #e0b25a; --wait-soft: #3a2f18; --tile-edge: #3a463f; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.6; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 24px 16px 48px; display: grid; gap: 20px; }
header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; }
h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(24px, 4vw, 34px); margin: 0; letter-spacing: .02em; text-wrap: balance; }
h1 span { color: var(--felt); }
.lead { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
.status { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.status i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
.status.live i { background: var(--felt); }
.main { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 820px) { .main { grid-template-columns: minmax(0, 1fr); } }

/* Calendar */
.cal { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; }
.cal-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
.cal-head h2 { font-family: var(--font-display); font-weight: 400; font-size: 22px; margin: 0; font-variant-numeric: tabular-nums; }
.nav { display: flex; gap: 6px; }
button { font: inherit; color: inherit; cursor: pointer; }
.btn-ghost { background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 4px 12px; }
.btn-ghost:hover { border-color: var(--felt); color: var(--felt); }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--felt); outline-offset: 2px; }
.grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.dow { text-align: center; font-size: 12px; color: var(--muted); padding-bottom: 4px; letter-spacing: .08em; }
.dow.sun { color: var(--shu); } .dow.sat { color: var(--felt); }
.day { min-height: 76px; border: 1px solid transparent; border-radius: 8px; background: transparent; text-align: left; padding: 6px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.day:hover { border-color: var(--line); }
.day .n { font-size: 13px; font-variant-numeric: tabular-nums; line-height: 1; }
.day.out .n { color: var(--muted); opacity: .5; }
.day.past .n { opacity: .5; }
.day.today .n { background: var(--fg); color: var(--bg); border-radius: 999px; padding: 3px 6px; align-self: flex-start; }
.day.sel { border-color: var(--felt); background: var(--felt-soft); }
.chips { display: flex; flex-wrap: wrap; gap: 3px; }
.chip { font-size: 11px; line-height: 1; padding: 3px 4px; border-radius: 4px; font-variant-numeric: tabular-nums; font-weight: 700; white-space: nowrap; }
.chip.open { background: var(--wait-soft); color: var(--wait); }
.chip.full { background: var(--shu-soft); color: var(--shu); }
@media (max-width: 480px) {
  .day { min-height: 54px; padding: 4px; }
  .chip { font-size: 10px; padding: 2px 3px; }
}
.legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 12px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }

/* Day panel */
.panel { display: grid; gap: 14px; }
.panel-head h2 { font-family: var(--font-display); font-weight: 400; font-size: 20px; margin: 0; }
.panel-head p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.table-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 12px; }
.tc-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.tc-time { font-family: var(--font-display); font-size: 22px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.tc-meta { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.pill { font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
.pill.open { background: var(--wait-soft); color: var(--wait); }
.pill.full { background: var(--shu-soft); color: var(--shu); }
.seats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.seat { border: 1px solid var(--tile-edge); border-bottom-width: 4px; border-radius: 6px; background: var(--bg); padding: 6px 4px 4px; text-align: center; min-width: 0; position: relative; }
.seat .wind { font-family: var(--font-display); font-size: 18px; line-height: 1; color: var(--muted); }
.seat.taken { background: var(--surface); }
.seat.taken .wind { color: var(--felt); }
.seat.taken:first-child .wind { color: var(--shu); }
.seat .who { font-size: 12px; margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.seat .who.empty { color: var(--muted); }
.seat .x { position: absolute; top: 1px; right: 2px; background: none; border: 0; color: var(--muted); font-size: 13px; line-height: 1; padding: 2px 4px; }
.seat .x:hover { color: var(--shu); }
.subs { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.subs b { color: var(--fg); font-weight: 500; background: var(--bg); border-radius: 4px; padding: 1px 6px; display: inline-flex; gap: 4px; align-items: center; }
.subs b button { background: none; border: 0; color: var(--muted); padding: 0; }
.note { font-size: 13px; background: var(--bg); border-radius: 6px; padding: 6px 10px; overflow-wrap: anywhere; white-space: pre-wrap; }
.join { display: flex; gap: 6px; flex-wrap: wrap; }
.join input { flex: 1 1 140px; min-width: 0; }
input, select, textarea { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; width: 100%; }
textarea { resize: vertical; min-height: 60px; }
.btn { background: var(--felt); color: var(--surface); border: 0; border-radius: 8px; padding: 8px 16px; font-weight: 700; white-space: nowrap; }
.btn:hover { filter: brightness(1.08); }
.btn:disabled { opacity: .5; cursor: default; }
.btn-danger { background: transparent; border: 1px solid var(--shu); color: var(--shu); border-radius: 8px; padding: 4px 10px; font-size: 12px; }
.tc-foot { display: flex; justify-content: flex-end; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); }
.link { background: none; border: 0; color: var(--muted); text-decoration: underline; font-size: 12px; padding: 0; }
.empty-day { border: 1px dashed var(--line); border-radius: var(--r); padding: 18px; color: var(--muted); font-size: 14px; }
form.new { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 10px; }
form.new h3 { margin: 0; font-size: 15px; }
.row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 400px) { .row { grid-template-columns: minmax(0, 1fr); } }
label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); letter-spacing: .04em; }
.msg { font-size: 13px; color: var(--shu); min-height: 1em; }
.upcoming { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; }
.upcoming h2 { font-size: 15px; margin: 0 0 8px; }
.up-list { list-style: none; margin: 0; padding: 0; display: grid; }
.up-list li { border-top: 1px solid var(--line); }
.up-list button { width: 100%; background: none; border: 0; text-align: left; padding: 8px 0; display: grid; grid-template-columns: 7.5em minmax(0, 1fr) auto; gap: 10px; align-items: center; font-variant-numeric: tabular-nums; }
.up-list button:hover .up-place { color: var(--felt); }
.up-place { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ro { font-size: 13px; color: var(--muted); }
@media (prefers-reduced-motion: no-preference) { .table-card { animation: in .2s ease-out; } @keyframes in { from { transform: translateY(4px); } to { transform: none; } } }
</style>

<div class="wrap">
  <header>
    <div>
      <h1>麻雀 <span>卓立て</span>カレンダー</h1>
      <p class="lead">日付を選んで卓を立てる。名前を入れて参加。4人そろえば卓成立。</p>
    </div>
    <div class="status" id="status"><i></i><span>接続中…</span></div>
  </header>

  <div class="main">
    <section class="cal" aria-label="カレンダー">
      <div class="cal-head">
        <h2 id="monthLabel"></h2>
        <div class="nav">
          <button class="btn-ghost" id="prev" aria-label="前の月">‹</button>
          <button class="btn-ghost" id="todayBtn">今日</button>
          <button class="btn-ghost" id="next" aria-label="次の月">›</button>
        </div>
      </div>
      <div class="grid" id="grid"></div>
      <div class="legend">
        <span><em class="chip open">2/4</em> 募集中（人数/4）</span>
        <span><em class="chip full">成立</em> 4人そろった卓</span>
      </div>
    </section>

    <section class="panel" id="panel" aria-live="polite"></section>
  </div>

  <section class="upcoming">
    <h2>これからの卓</h2>
    <ul class="up-list" id="upList"></ul>
  </section>
</div>

<script>
(function () {
  const WINDS = ["東", "南", "西", "北"];
  const DOW = ["日", "月", "火", "水", "木", "金", "土"];
  const pad = n => String(n).padStart(2, "0");
  const ymd = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  const todayStr = ymd(new Date());

  const S = {
    db: null, canWrite: true, live: false,
    tables: [], seats: [],
    month: new Date(new Date().getFullYear(), new Date().getMonth(), 1),
    selected: todayStr,
    confirm: null, // "seat:<id>" or "table:<id>"
  };

  const store = {
    get(k) { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  };

  const $ = id => document.getElementById(id);
  const el = (tag, attrs, ...kids) => {
    const n = document.createElement(tag);
    for (const k in attrs || {}) {
      if (k === "class") n.className = attrs[k];
      else if (k.startsWith("on")) n.addEventListener(k.slice(2), attrs[k]);
      else if (attrs[k] !== undefined && attrs[k] !== null && attrs[k] !== false) n.setAttribute(k, attrs[k]);
    }
    for (const c of kids.flat()) if (c != null) n.append(c.nodeType ? c : document.createTextNode(c));
    return n;
  };

  function seatsOf(tid) {
    return S.seats.filter(s => s.tableId === tid).sort((a, b) => (a.joinedAt || 0) - (b.joinedAt || 0));
  }
  function tablesOn(date) {
    return S.tables.filter(t => t.date === date).sort((a, b) => (a.time || "").localeCompare(b.time || ""));
  }
  function fmtDate(s) {
    const [y, m, d] = s.split("-").map(Number);
    const dt = new Date(y, m - 1, d);
    return m + "月" + d + "日（" + DOW[dt.getDay()] + "）";
  }

  /* ---------- Calendar ---------- */
  function renderCal() {
    const y = S.month.getFullYear(), m = S.month.getMonth();
    $("monthLabel").textContent = y + "年 " + (m + 1) + "月";
    const g = $("grid");
    g.textContent = "";
    DOW.forEach((d, i) => g.append(el("div", { class: "dow" + (i === 0 ? " sun" : i === 6 ? " sat" : "") }, d)));
    const start = new Date(y, m, 1 - new Date(y, m, 1).getDay());
    for (let i = 0; i < 42; i++) {
      const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
      if (i === 35 && d.getMonth() !== m) break;
      const key = ymd(d);
      const cls = ["day"];
      if (d.getMonth() !== m) cls.push("out");
      if (key < todayStr) cls.push("past");
      if (key === todayStr) cls.push("today");
      if (key === S.selected) cls.push("sel");
      const chips = tablesOn(key).map(t => {
        const n = seatsOf(t.id).length;
        return n >= 4
          ? el("span", { class: "chip full" }, "成立")
          : el("span", { class: "chip open" }, n + "/4");
      });
      g.append(el("button", {
        class: cls.join(" "),
        "aria-label": fmtDate(key) + (chips.length ? "、卓" + chips.length + "件" : ""),
        onclick: () => { S.selected = key; S.confirm = null; render(); },
      }, el("span", { class: "n" }, String(d.getDate())), chips.length ? el("div", { class: "chips" }, chips) : null));
    }
  }

  /* ---------- Day panel ---------- */
  function seatView(t) {
    const list = seatsOf(t.id);
    const main = list.slice(0, 4), subs = list.slice(4);
    const cells = WINDS.map((w, i) => {
      const s = main[i];
      if (!s) return el("div", { class: "seat" }, el("div", { class: "wind" }, w), el("div", { class: "who empty" }, "空き"));
      const key = "seat:" + s.id;
      return el("div", { class: "seat taken" },
        el("div", { class: "wind" }, w),
        el("div", { class: "who", title: s.name }, s.name),
        S.canWrite ? el("button", { class: "x", "aria-label": s.name + " の参加を取り消す", onclick: () => { S.confirm = S.confirm === key ? null : key; renderPanel(); } }, "×") : null);
    });
    const out = [el("div", { class: "seats" }, cells)];
    if (subs.length) {
      out.push(el("div", { class: "subs" }, "補欠:",
        subs.map(s => el("b", null, s.name,
          S.canWrite ? el("button", { "aria-label": s.name + " の参加を取り消す", onclick: () => { S.confirm = "seat:" + s.id; renderPanel(); } }, "×") : null))));
    }
    const pending = S.confirm && S.confirm.startsWith("seat:") && list.find(s => "seat:" + s.id === S.confirm);
    if (pending) {
      out.push(el("div", { class: "tc-foot" }, pending.name + " さんの参加を取り消しますか？",
        el("button", { class: "btn-danger", onclick: () => removeSeat(pending.id) }, "取り消す"),
        el("button", { class: "link", onclick: () => { S.confirm = null; renderPanel(); } }, "やめる")));
    }
    return out;
  }

  function tableCard(t) {
    const n = seatsOf(t.id).length;
    const full = n >= 4;
    const nameId = "join-" + t.id;
    const card = el("article", { class: "table-card" },
      el("div", { class: "tc-top" },
        el("div", null,
          el("div", { class: "tc-time" }, t.time || "時間未定"),
          el("div", { class: "tc-meta" }, [t.rule, t.place].filter(Boolean).join(" ・ "))),
        el("span", { class: "pill " + (full ? "full" : "open") }, full ? "卓成立" : "あと" + (4 - n) + "人")),
      seatView(t),
      t.note ? el("div", { class: "note" }, t.note) : null);

    if (S.canWrite) {
      const input = el("input", { id: nameId, placeholder: "あなたの名前", maxlength: "20", value: store.get("mj-name"), "aria-label": "名前" });
      const msg = el("div", { class: "msg" });
      const btn = el("button", { class: "btn", type: "submit" }, full ? "補欠で参加" : "参加する");
      card.append(el("form", { class: "join", onsubmit: e => { e.preventDefault(); join(t.id, input.value, msg, btn); } }, input, btn), msg);
      const tkey = "table:" + t.id;
      card.append(S.confirm === tkey
        ? el("div", { class: "tc-foot" }, "この卓を削除しますか？参加者の記録も消えます。",
            el("button", { class: "btn-danger", onclick: () => removeTable(t.id) }, "削除する"),
            el("button", { class: "link", onclick: () => { S.confirm = null; renderPanel(); } }, "やめる"))
        : el("div", { class: "tc-foot" }, el("button", { class: "link", onclick: () => { S.confirm = tkey; renderPanel(); } }, "この卓を削除")));
    }
    return card;
  }

  function newForm() {
    const f = el("form", { class: "new", id: "newForm" },
      el("h3", null, fmtDate(S.selected) + " に卓を立てる"),
      el("div", { class: "row" },
        el("label", null, "開始時刻", el("input", { type: "time", id: "f-time", value: "19:00", required: true })),
        el("label", null, "ルール", el("select", { id: "f-rule" },
          ["半荘戦", "東風戦", "三人麻雀", "ルール相談"].map(r => el("option", null, r))))),
      el("label", null, "場所", el("input", { id: "f-place", maxlength: "40", placeholder: "例：駅前の雀荘、〇〇さん宅、オンライン" })),
      el("label", null, "メモ（任意）", el("textarea", { id: "f-note", maxlength: "200", placeholder: "例：終電まで。初心者歓迎。" })),
      el("label", null, "言い出しっぺの名前（東家に入ります）", el("input", { id: "f-host", maxlength: "20", required: true, value: store.get("mj-name"), placeholder: "あなたの名前" })),
      el("div", { class: "msg", id: "f-msg" }),
      el("div", null, el("button", { class: "btn", type: "submit", id: "f-submit" }, "卓を立てる")));
    f.addEventListener("submit", e => { e.preventDefault(); createTable(); });
    return f;
  }

  function renderPanel() {
    const p = $("panel");
    const keep = {};
    ["f-time", "f-rule", "f-place", "f-note", "f-host"].forEach(id => { const x = $(id); if (x) keep[id] = x.value; });
    const joinDrafts = {};
    p.querySelectorAll("input[id^='join-']").forEach(x => { joinDrafts[x.id] = x.value; });
    const focusId = document.activeElement && document.activeElement.id;

    p.textContent = "";
    const list = tablesOn(S.selected);
    p.append(el("div", { class: "panel-head" },
      el("h2", null, fmtDate(S.selected)),
      el("p", null, list.length ? "卓 " + list.length + " 件" : "まだ卓はありません")));
    if (!list.length) p.append(el("div", { class: "empty-day" },
      S.canWrite ? "この日に打ちたい人は、下のフォームから卓を立ててください。参加者が名前を入れると東・南・西・北の順に席が埋まります。"
                 : "この日の卓はまだありません。"));
    list.forEach(t => p.append(tableCard(t)));
    if (S.canWrite && S.selected >= todayStr) p.append(newForm());
    if (!S.canWrite) p.append(el("p", { class: "ro" }, "閲覧のみの権限です。参加するには共有設定で「Contributor」以上の権限をもらってください。"));

    for (const id in keep) { const x = $(id); if (x && keep[id] !== undefined) x.value = keep[id]; }
    for (const id in joinDrafts) { const x = $(id); if (x) x.value = joinDrafts[id]; }
    if (focusId) { const x = $(focusId); if (x) x.focus(); }
  }

  function renderUpcoming() {
    const ul = $("upList");
    ul.textContent = "";
    const up = S.tables.filter(t => t.date >= todayStr)
      .sort((a, b) => (a.date + (a.time || "")).localeCompare(b.date + (b.time || ""))).slice(0, 8);
    if (!up.length) { ul.append(el("li", { class: "ro", style: "padding:8px 0" }, S.live ? "予定されている卓はまだありません。" : "読み込み中…")); return; }
    up.forEach(t => {
      const n = seatsOf(t.id).length;
      ul.append(el("li", null, el("button", {
        onclick: () => { const [y, m] = t.date.split("-").map(Number); S.selected = t.date; S.month = new Date(y, m - 1, 1); S.confirm = null; render(); $("panel").scrollIntoView({ behavior: "smooth", block: "start" }); },
      },
        el("span", null, fmtDate(t.date)),
        el("span", { class: "up-place" }, (t.time || "") + "　" + [t.rule, t.place].filter(Boolean).join(" ・ ")),
        el("span", { class: "pill " + (n >= 4 ? "full" : "open") }, n >= 4 ? "成立" : n + "/4"))));
    });
  }

  function render() { renderCal(); renderPanel(); renderUpcoming(); }

  /* ---------- Writes ---------- */
  const errText = e => e && e.code === "quota_exceeded" ? "保存できる件数の上限です。古い卓を削除してください。"
    : e && e.code === "invalid_argument" ? "書き込み権限がありません。"
    : "保存できませんでした。もう一度お試しください。";

  async function createTable() {
    const host = $("f-host").value.trim(), msg = $("f-msg"), btn = $("f-submit");
    if (!host) { msg.textContent = "名前を入れてください。"; return; }
    if (!S.db) { msg.textContent = "まだ接続できていません。少し待ってからお試しください。"; return; }
    btn.disabled = true; msg.textContent = "";
    try {
      const ref = S.db.collection("tables").doc();
      await ref.set({
        date: S.selected, time: $("f-time").value, rule: $("f-rule").value,
        place: $("f-place").value.trim(), note: $("f-note").value.trim(), createdAt: Date.now(),
      });
      await S.db.collection("seats").add({ tableId: ref.id, name: host, joinedAt: Date.now() });
      store.set("mj-name", host);
      ["f-place", "f-note"].forEach(id => { const x = $(id); if (x) x.value = ""; });
    } catch (e) {
      msg.textContent = errText(e);
      if (e && e.code === "invalid_argument") { S.canWrite = false; renderPanel(); }
    } finally { const b = $("f-submit"); if (b) b.disabled = false; }
  }

  async function join(tid, raw, msg, btn) {
    const name = raw.trim();
    if (!name) { msg.textContent = "名前を入れてください。"; return; }
    if (seatsOf(tid).some(s => s.name === name)) { msg.textContent = name + " さんはもう参加しています。"; return; }
    if (!S.db) { msg.textContent = "まだ接続できていません。"; return; }
    btn.disabled = true; msg.textContent = "";
    try {
      await S.db.collection("seats").add({ tableId: tid, name, joinedAt: Date.now() });
      store.set("mj-name", name);
    } catch (e) { msg.textContent = errText(e); btn.disabled = false; }
  }

  async function removeSeat(id) {
    S.confirm = null;
    try { await S.db.doc("seats/" + id).delete(); } catch (e) {}
    renderPanel();
  }

  async function removeTable(tid) {
    S.confirm = null;
    try {
      for (const s of seatsOf(tid)) await S.db.doc("seats/" + s.id).delete();
      await S.db.doc("tables/" + tid).delete();
    } catch (e) {}
    render();
  }

  /* ---------- Nav ---------- */
  $("prev").onclick = () => { S.month = new Date(S.month.getFullYear(), S.month.getMonth() - 1, 1); renderCal(); };
  $("next").onclick = () => { S.month = new Date(S.month.getFullYear(), S.month.getMonth() + 1, 1); renderCal(); };
  $("todayBtn").onclick = () => { const t = new Date(); S.month = new Date(t.getFullYear(), t.getMonth(), 1); S.selected = todayStr; S.confirm = null; render(); };

  function setStatus(text, live) {
    const s = $("status"); s.className = "status" + (live ? " live" : "");
    s.lastElementChild.textContent = text;
  }

  render();

  /* ---------- Connect ---------- */
  (async () => {
    const use = window.claude && window.claude.use;
    if (!use) { setStatus("オフライン表示（保存されません）", false); S.canWrite = false; render(); return; }
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db) { setStatus("共有データに接続できません", false); S.canWrite = false; render(); return; }
    S.db = db;
    if (user) { try { const c = await user.can("data.write"); if (c === false) S.canWrite = false; } catch (e) {} }
    const seen = { tables: false, seats: false };
    const ready = k => { seen[k] = true; if (seen.tables && seen.seats && !S.live) { S.live = true; setStatus("みんなと共有中", true); } };
    const onErr = () => setStatus("接続が切れました。再読み込みしてください", false);
    db.collection("tables").onSnapshot(snap => {
      S.tables = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
      ready("tables"); render();
    }, onErr);
    db.collection("seats").onSnapshot(snap => {
      S.seats = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
      ready("seats"); render();
    }, onErr);
  })();
})();
</script>
