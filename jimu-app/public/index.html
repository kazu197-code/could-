<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>事務の分身</title>
<meta name="theme-color" content="#1f3a5f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="事務の分身">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-180.png">
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --text: #1d232b; --muted: #5f6b7a; --line: #d9dee5;
    --accent: #1f3a5f; --accent-text: #ffffff; --accent-soft: #e6edf6; --warn: #8a5a00; --warn-bg: #fff4dc;
    --err: #a32121; --err-bg: #fdeaea; --paper: #ffffff; --paper-text: #111;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14181d; --card: #1d232b; --text: #e8ecf1; --muted: #9aa6b4; --line: #333c47;
      --accent: #7fa8d9; --accent-text: #0e1620; --accent-soft: #24313f; --warn: #f0c36a; --warn-bg: #3a2f17;
      --err: #ff9c9c; --err-bg: #3d1f1f;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: "BIZ UDGothic", "BIZ UDゴシック", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
    font-size: 16px; line-height: 1.6; -webkit-text-size-adjust: 100%; }
  header { position: sticky; top: 0; z-index: 5; background: var(--accent); color: var(--accent-text);
    padding: calc(env(safe-area-inset-top) + 10px) 16px 10px; display: flex; align-items: center; justify-content: space-between; }
  header h1 { font-size: 18px; margin: 0; letter-spacing: .05em; }
  header button { background: transparent; color: inherit; border: 1px solid currentColor; border-radius: 8px; padding: 4px 10px; font: inherit; font-size: 14px; }
  main { max-width: 640px; margin: 0 auto; padding: 16px 16px calc(env(safe-area-inset-bottom) + 96px); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 16px; }
  .card h2 { font-size: 15px; margin: 0 0 10px; color: var(--muted); font-weight: 600; }
  label { display: block; font-size: 14px; color: var(--muted); margin: 12px 0 4px; }
  input, textarea, select { width: 100%; font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  textarea { resize: vertical; min-height: 96px; }
  input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .seg { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .seg button { padding: 12px 4px; line-height: 1.3; }
  .seg button[data-kind] { font-size: 15px; white-space: nowrap; letter-spacing: -.02em; }
  .seg button small { font-size: 12px; opacity: .8; font-weight: 400; }
  .seg button { font: inherit; padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 700; }
  .btn { display: block; width: 100%; font: inherit; font-weight: 700; padding: 14px; border-radius: 12px; border: 0;
    background: var(--accent); color: var(--accent-text); margin-top: 14px; }
  .btn.secondary { background: var(--accent-soft); color: var(--text); }
  .btn:disabled { opacity: .55; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .date-row { grid-template-columns: 1.5fr 1fr; }
  .hint { font-size: 13px; color: var(--muted); margin: 6px 0 0; }
  .msg { border-radius: 10px; padding: 10px 12px; font-size: 14px; margin-top: 12px; }
  .msg.warn { background: var(--warn-bg); color: var(--warn); }
  .msg.err { background: var(--err-bg); color: var(--err); }
  .item { border: 1px dashed var(--line); border-radius: 10px; padding: 8px 10px 10px; margin-top: 10px; }
  .item-head { display: flex; gap: 8px; align-items: center; }
  .item-head span { font-weight: 700; min-width: 1.5em; }
  .item-head button, .add { font: inherit; font-size: 14px; border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 8px; padding: 6px 10px; white-space: nowrap; }
  .add { margin-top: 10px; }
  .check { display: flex; align-items: center; gap: 8px; margin-top: 12px; color: var(--text); font-size: 15px; }
  .check input { width: auto; }
  /* 紙のプレビュー（A4を縮小） */
  .paper-wrap { overflow: hidden; border-radius: 6px; border: 1px solid var(--line); background: #cfd5dc; padding: 10px; }
  .paper { background: var(--paper); color: var(--paper-text); width: 100%; aspect-ratio: 210 / 297; padding: 11.8% 10.1% 10.1%;
    font-family: "BIZ UDGothic", "BIZ UDゴシック", sans-serif; font-size: 8px; line-height: 1.5; overflow: hidden; }
  .paper p { margin: 0; min-height: 1.5em; white-space: pre-wrap; word-break: break-all; }
  .paper .r { text-align: right; } .paper .c { text-align: center; } .paper .i1 { text-indent: 1em; }
  .paper .contact { padding-left: 24em; white-space: nowrap; }
  .spinner { display: inline-block; width: 1em; height: 1em; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -2px; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .bottom { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line);
    padding: 10px 16px calc(env(safe-area-inset-bottom) + 10px); }
  .bottom-inner { max-width: 640px; margin: 0 auto; display: flex; gap: 8px; }
  .bottom-inner .btn { margin-top: 0; flex: 1; padding: 13px 8px; font-size: 15px; }
  #saveDrive:not([hidden]) + #saveDocx { background: var(--accent-soft); color: var(--text); }
  .kw-row { display: flex; gap: 8px; align-items: center; }
  .kw-row .add { margin-top: 0; }
  .files { list-style: none; margin: 8px 0 0; padding: 0; }
  .files li { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-top: 8px; }
  .files li.on { border-color: var(--accent); background: var(--accent-soft); }
  .files .name { font-weight: 700; word-break: break-all; }
  .files .meta { font-size: 13px; color: var(--muted); }
  .files .meta a { color: var(--accent); }
  .files .pick { display: flex; gap: 8px; margin-top: 8px; }
  .files .pick button { flex: 1; font: inherit; font-size: 14px; padding: 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--text); }
  .files .pick button[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 700; }
  .msg.info { background: var(--accent-soft); color: var(--text); }
  .msg ul { margin: 4px 0 0; padding-left: 1.2em; }
  .msg a { color: inherit; font-weight: 700; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <h1>事務の分身</h1>
  <button id="toSettings" type="button">設定</button>
</header>

<main>
  <!-- 作成画面 -->
  <section id="create">
    <div class="card">
      <h2>1. 文書の種類</h2>
      <div class="seg" role="group" aria-label="文書の種類">
        <button type="button" data-kind="jimu" aria-pressed="true">事務連絡</button>
        <button type="button" data-kind="tsuchi" aria-pressed="false">通知文</button>
        <button type="button" data-kind="matome" aria-pressed="false">資料まとめ</button>
      </div>
      <div class="matome-only" hidden>
        <label>長さ（短いほど早くできます）</label>
        <div class="seg pages" role="group" aria-label="長さ">
          <button type="button" data-pages="1">A4 1枚<br><small>20〜30秒</small></button>
          <button type="button" data-pages="2">A4 2枚<br><small>35〜45秒</small></button>
          <button type="button" data-pages="3">A4 3枚<br><small>50〜60秒</small></button>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>2. 頼みたいこと</h2>
      <textarea id="request" rows="5" placeholder="例：12月の日勤調査担当会議の開催通知。12月10日（木）14時から、中央消防署3階会議室。各署の調査担当者1名が出席。資料は当日配布。"></textarea>
      <p class="hint">キーボードのマイクボタンで話して入力することもできます。</p>
      <div id="statusMsg"></div>
      <div id="driveBox" hidden>
        <button class="btn" id="autoBtn" type="button">おまかせで作る（資料も自動で選ぶ）</button>
        <button class="btn secondary" id="searchBtn" type="button">自分で資料を選ぶ</button>
        <div id="searchMsg"></div>
        <div id="results" hidden>
          <label for="keywords">探した言葉（変えて探し直せます）</label>
          <div class="kw-row"><input id="keywords"><button class="add" id="researchBtn" type="button">探し直す</button></div>
          <p class="hint">使う資料を選んでください。「元にする」は1つ、「参考」は4つまで。</p>
          <ul class="files" id="fileList"></ul>
        </div>
      </div>
      <button class="btn" id="draftBtn" type="button">下書きを作る</button>
      <div id="draftMsg"></div>
    </div>

    <div id="editor" hidden>
      <div class="card">
        <h2>3. 下書きの確認・手直し</h2>
        <div id="missing"></div>
        <div id="usedDocs"></div>
        <div id="notes"></div>
        <div id="docNumberWrap" hidden>
          <label for="docNumber">文書番号</label>
          <input id="docNumber" placeholder="松消総第　　号">
        </div>
        <div class="row date-row">
          <div><label for="date">日付</label><input id="date"></div>
          <div class="jimu-only"><label for="recipient">宛先</label><input id="recipient"></div>
        </div>
        <label for="sender" id="senderLabel">発信者</label>
        <input id="sender">
        <label for="title" id="titleLabel">件名</label>
        <textarea id="title" rows="2" style="min-height:64px"></textarea>
        <div class="jimu-only">
          <label for="body">本文（段落ごとに改行）</label>
          <textarea id="body" rows="6"></textarea>
          <label>記（項目）</label>
          <div id="items"></div>
          <button class="add" id="addItem" type="button">＋ 項目を追加</button>
          <label class="check"><input type="checkbox" id="closing"> 最後に「以上」を入れる</label>
        </div>
        <div class="matome-only" hidden>
          <label for="mbody">中身</label>
          <textarea id="mbody" rows="16" style="min-height:360px"></textarea>
          <p class="hint">「■」で始まる行が見出し、「・」や「①」で始まる行が箇条書き、それ以外は説明の文です。【ポイント】【出典】の下も「・」で並べます。</p>
        </div>
        <div class="row">
          <div><label for="cOffice">事務局</label><input id="cOffice"></div>
          <div><label for="cExt">内線</label><input id="cExt"></div>
        </div>
        <label for="cPerson">担当</label>
        <input id="cPerson">
      </div>

      <div class="card">
        <h2>4. AIに直してもらう</h2>
        <textarea id="revision" rows="3" placeholder="例：日付を12月11日に変えて。本文をもう少し丁寧に。"></textarea>
        <button class="btn secondary" id="reviseBtn" type="button">この内容で直す</button>
        <div id="reviseMsg"></div>
      </div>

      <div class="card">
        <h2>仕上がりイメージ</h2>
        <div class="paper-wrap"><div class="paper" id="paper"></div></div>
        <p class="hint">Wordではお手本どおり、BIZ UDゴシック 12pt・A4で作られます。</p>
      </div>
    </div>
  </section>

  <!-- 設定画面 -->
  <section id="settings" hidden>
    <div class="card">
      <h2>合言葉</h2>
      <input id="sPass" type="password" autocomplete="current-password" placeholder="Netlify に設定した合言葉">
      <p class="hint">この端末にだけ保存されます。</p>
    </div>
    <div class="card">
      <h2>いつも使う値</h2>
      <label for="sSender">発信者</label><input id="sSender" placeholder="例：消　防　局　長">
      <label for="sRecipient">宛先</label><input id="sRecipient" placeholder="所　属　長">
      <label for="sOffice">事務局</label><input id="sOffice" placeholder="例：中央消防署日勤">
      <label for="sPerson">担当</label><input id="sPerson" placeholder="例：〇〇">
      <label for="sExt">内線</label><input id="sExt" placeholder="例：9022">
      <label for="sPrefix">文書番号の頭（通知文）</label><input id="sPrefix" placeholder="例：松消総第　　号">
      <button class="btn" id="saveSettings" type="button">保存して戻る</button>
    </div>
  </section>
</main>

<div class="bottom" id="bottomBar" hidden>
  <div class="bottom-inner">
    <button class="btn" id="saveDrive" type="button" hidden>ドライブに保存</button>
    <button class="btn" id="saveDocx" type="button">Wordで保存（共有メニュー）</button>
  </div>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const store = {
    get(k, d = "") { try { return localStorage.getItem("jimu:" + k) ?? d; } catch { return d; } },
    set(k, v) { try { localStorage.setItem("jimu:" + k, v); } catch {} },
  };
  const zen = (s) => String(s).replace(/[0-9]/g, (d) => String.fromCharCode(d.charCodeAt(0) + 0xfee0));
  const today = () => { const d = new Date(); return `令和${zen(d.getFullYear() - 2018)}年${zen(d.getMonth() + 1)}月${zen(d.getDate())}日`; };

  let kind = store.get("kind", "jimu");
  let items = [];
  let lastRequest = "";

  // ---- 種類 ----
  const segButtons = document.querySelectorAll(".seg button[data-kind]");
  let pages = store.get("pages", "2");
  const pageButtons = document.querySelectorAll(".seg button[data-pages]");
  const applyPages = () => pageButtons.forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.pages === pages)));
  pageButtons.forEach((b) => b.addEventListener("click", () => { pages = b.dataset.pages; store.set("pages", pages); applyPages(); }));
  applyPages();
  const applyKind = () => {
    segButtons.forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.kind === kind)));
    $("docNumberWrap").hidden = kind !== "tsuchi";
    const m = kind === "matome";
    document.querySelectorAll(".jimu-only").forEach((el) => { el.hidden = m; });
    document.querySelectorAll(".matome-only").forEach((el) => { el.hidden = !m; });
    $("senderLabel").textContent = m ? "作成者（空欄でも可）" : "発信者";
    $("titleLabel").textContent = m ? "題名" : "件名";
    $("request").placeholder = m
      ? "例：フレックスタイム制の決まりを、新しく対象になる職員向けの研修資料にまとめて。申請の流れと注意点を中心に。"
      : "例：12月の日勤調査担当会議の開催通知。12月10日（木）14時から、中央消防署3階会議室。各署の調査担当者1名が出席。資料は当日配布。";
    render();
  };
  segButtons.forEach((b) => b.addEventListener("click", () => { kind = b.dataset.kind; store.set("kind", kind); applyKind(); }));

  // ---- 設定 ----
  const settingsMap = { sPass: "pass", sSender: "sender", sRecipient: "recipient", sOffice: "office", sPerson: "person", sExt: "ext", sPrefix: "prefix" };
  const showSettings = (on) => {
    $("settings").hidden = !on; $("create").hidden = on;
    $("bottomBar").hidden = on || $("editor").hidden;
    $("toSettings").textContent = on ? "戻る" : "設定";
    if (on) for (const [id, k] of Object.entries(settingsMap)) $(id).value = store.get(k, k === "recipient" ? "所　属　長" : "");
    window.scrollTo(0, 0);
  };
  $("toSettings").addEventListener("click", () => showSettings($("settings").hidden));
  $("saveSettings").addEventListener("click", () => {
    for (const [id, k] of Object.entries(settingsMap)) store.set(k, $(id).value.trim());
    showSettings(false);
    checkStatus();
  });
  if (!store.get("pass")) showSettings(true);

  // ---- 通信 ----
  async function api(path, body) {
    const res = await fetch(path, {
      method: "POST",
      headers: { "content-type": "application/json", "x-passcode": store.get("pass") },
      body: JSON.stringify(body),
    });
    if (res.status === 504) throw new Error("時間がかかりすぎて止まりました。参考にする資料を減らすか、もう一度お試しください。");
    if (!res.ok) {
      let msg = `エラーが起きました（${res.status}）`;
      try { msg = (await res.json()).error || msg; } catch {}
      throw new Error(msg);
    }
    if (path === "/api/docx") return res;
    // 時間のかかる処理は、空白を送り続けたあとに JSON が届く
    const text = await res.text();
    let data;
    try { data = JSON.parse(text.trim()); } catch { throw new Error("返事を読み取れませんでした。もう一度お試しください。"); }
    if (data && data.error) throw new Error(data.error);
    return { json: async () => data };
  }
  const busy = (btn, on, label) => {
    btn.disabled = on;
    btn.innerHTML = on ? `<span class="spinner"></span>${label}` : btn.dataset.label;
  };
  ["draftBtn", "reviseBtn", "saveDocx", "saveDrive", "searchBtn", "researchBtn", "autoBtn"].forEach((id) => { $(id).dataset.label = $(id).textContent; });
  const showMsg = (el, text, cls = "err") => { el.innerHTML = text ? `<div class="msg ${cls}"></div>` : ""; if (text) el.firstChild.textContent = text; };

  // ---- 下書き ----
  function fillHeader() {
    $("date").value = $("date").value || today();
    $("recipient").value = $("recipient").value || store.get("recipient", "所　属　長");
    if (kind !== "matome") $("sender").value = $("sender").value || store.get("sender");
    $("docNumber").value = $("docNumber").value || store.get("prefix");
    $("cOffice").value = $("cOffice").value || store.get("office");
    $("cPerson").value = $("cPerson").value || store.get("person");
    $("cExt").value = $("cExt").value || store.get("ext");
  }
  // 資料まとめ：画面では記号付きの文章で編集し、保存時に構造に戻す
  function toMarkup(d) {
    const L = [];
    if ((d.points || []).length) { L.push("【ポイント】"); d.points.forEach((t) => L.push("・" + t)); L.push(""); }
    (d.sections || []).forEach((sec) => {
      L.push("■" + sec.heading);
      (sec.blocks || []).forEach((b) => L.push(b.type === "bullet" && !/^[①-⑳]/.test(b.text) ? "・" + b.text : b.text));
      L.push("");
    });
    if ((d.sources || []).length) { L.push("【出典】"); d.sources.forEach((t) => L.push("・" + t)); }
    return L.join("\n").trim();
  }
  function parseMarkup(text) {
    const out = { points: [], sections: [], sources: [] };
    let mode = "", sec = null;
    for (const raw of text.split("\n")) {
      const t = raw.trim(); if (!t) continue;
      if (/^【\s*(この資料の)?ポイント\s*】$/.test(t)) { mode = "points"; continue; }
      if (/^【\s*出典\s*】$/.test(t)) { mode = "sources"; continue; }
      if (/^[■◆]/.test(t)) { sec = { heading: t.replace(/^[■◆]\s*/, ""), blocks: [] }; out.sections.push(sec); mode = "sec"; continue; }
      const item = t.replace(/^[・･\-]\s*/, "");
      if (mode === "points") out.points.push(item);
      else if (mode === "sources") out.sources.push(item);
      else {
        if (!sec) { sec = { heading: "", blocks: [] }; out.sections.push(sec); }
        const bullet = /^[・･\-]/.test(t) || /^[①-⑳]/.test(t);
        sec.blocks.push({ type: bullet ? "bullet" : "text", text: item });
      }
    }
    return out;
  }
  function applyDraft(d) {
    $("title").value = d.title || "";
    if (d.sections) $("mbody").value = toMarkup(d);
    $("body").value = (d.body || []).join("\n");
    items = (d.items || []).map((it) => ({ heading: it.heading || "", lines: (it.lines || []).join("\n") }));
    renderItems();
    const miss = d.missing || [];
    $("missing").innerHTML = "";
    if (miss.length) showMsg($("missing"), "確認してください：" + miss.join("、") + "（文中の「〇〇」を書き換えてください）", "warn");
    const notes = d.notes || [];
    $("notes").innerHTML = "";
    if (notes.length) {
      const box = document.createElement("div"); box.className = "msg info";
      box.textContent = "変えたところ・根拠にした資料"; const ul = document.createElement("ul");
      notes.forEach((n) => { const li = document.createElement("li"); li.textContent = n; ul.appendChild(li); });
      box.appendChild(ul); $("notes").appendChild(box);
    }
    $("editor").hidden = false; $("bottomBar").hidden = false;
    render();
  }
  function currentDraft() {
    if (kind === "matome") return { title: $("title").value.replace(/\s*\n\s*/g, "").trim(), ...parseMarkup($("mbody").value) };
    return {
      title: $("title").value.replace(/\s*\n\s*/g, "").trim(),
      body: $("body").value.split("\n").map((s) => s.trim()).filter(Boolean),
      items: items.map((it) => ({ heading: it.heading.trim(), lines: it.lines.split("\n").map((s) => s.trim()).filter(Boolean) })),
    };
  }

  async function runDraft(btn, label) {
    const request = $("request").value.trim();
    busy(btn, true, label);
    try {
      const res = await api("/api/draft", { kind, pages, request, today: $("date").value, sender: $("sender").value, recipient: $("recipient").value, baseIds: picked.base ? [picked.base] : [], refIds: picked.refs });
      lastRequest = request;
      applyDraft((await res.json()).draft);
      renderUsed();
      $("editor").scrollIntoView({ behavior: "smooth" });
    } catch (e) { showMsg($("draftMsg"), e.message); }
    finally { busy(btn, false); }
  }
  function startCheck() {
    const request = $("request").value.trim();
    if (!request) { showMsg($("draftMsg"), "頼みたいことを入力してください。"); return false; }
    if (!store.get("pass")) { showSettings(true); return false; }
    showMsg($("draftMsg"), ""); showMsg($("searchMsg"), "");
    fillHeader();
    return true;
  }
  $("draftBtn").addEventListener("click", () => { if (startCheck()) runDraft($("draftBtn"), "作成中…（20秒ほど）"); });
  $("autoBtn").addEventListener("click", async () => {
    if (!startCheck()) return;
    const btn = $("autoBtn");
    busy(btn, true, "資料を探して選んでいます…");
    try {
      const res = await api("/api/auto", { kind, request: $("request").value.trim(), today: $("date").value });
      const data = await res.json();
      $("keywords").value = (data.keywords || []).join("　");
      files = data.files || [];
      picked.base = data.picks.base ? data.picks.base.id : null;
      picked.refs = (data.picks.refs || []).map((r) => r.id);
      reasons = {};
      if (data.picks.base) reasons[data.picks.base.id] = data.picks.base.reason;
      (data.picks.refs || []).forEach((r) => { reasons[r.id] = r.reason; });
      $("results").hidden = false; renderFiles();
      if (!files.length) showMsg($("searchMsg"), "関係しそうな資料が見つからなかったので、依頼文だけで作ります。", "warn");
    } catch (e) { busy(btn, false); return showMsg($("draftMsg"), e.message); }
    await runDraft(btn, "下書きを作っています…（30秒ほど）");
  });
  // 下書きに使った資料と、AIが選んだ理由
  function renderUsed() {
    const box = $("usedDocs"); box.innerHTML = "";
    const used = [picked.base && ["元にした文書", picked.base], ...picked.refs.map((id) => ["参考にした資料", id])].filter(Boolean);
    if (!used.length) return;
    const div = document.createElement("div"); div.className = "msg info";
    div.textContent = "使った資料（違っていたら上の一覧で選び直して「下書きを作る」）";
    const ul = document.createElement("ul");
    used.forEach(([role, id]) => {
      const f = files.find((x) => x.id === id); if (!f) return;
      const li = document.createElement("li");
      li.textContent = `${role}：${f.name}${reasons[id] ? `（${reasons[id]}）` : ""}`;
      ul.appendChild(li);
    });
    div.appendChild(ul); box.appendChild(div);
  }

  $("reviseBtn").addEventListener("click", async () => {
    const revision = $("revision").value.trim();
    if (!revision) return showMsg($("reviseMsg"), "直してほしいことを入力してください。");
    showMsg($("reviseMsg"), "");
    busy($("reviseBtn"), true, "直しています…");
    try {
      const res = await api("/api/draft", { kind, pages, request: lastRequest || $("request").value.trim(), today: $("date").value, sender: $("sender").value, recipient: $("recipient").value, current: currentDraft(), revision });
      applyDraft((await res.json()).draft);
      $("revision").value = "";
      showMsg($("reviseMsg"), "直しました。下の仕上がりイメージを確認してください。", "warn");
    } catch (e) { showMsg($("reviseMsg"), e.message); }
    finally { busy($("reviseBtn"), false); }
  });

  // ---- ドライブの資料 ----
  let driveOn = false;
  let files = [];
  const picked = { base: null, refs: [] };
  let reasons = {};
  async function checkStatus() {
    if (!store.get("pass")) return;
    let note = "";
    try {
      const res = await api("/api/status", {});
      const st = await res.json();
      driveOn = Boolean(st.drive);
      const miss = Object.entries(st.has || {}).filter(([, v]) => !v).map(([k]) => k);
      if (miss.length) note = "Netlify に次の設定が見つかりません：" + miss.join("、") + "。Netlify の環境変数を確認してください。";
    } catch (e) { driveOn = false; note = "接続の確認でエラー：" + e.message; }
    $("driveBox").hidden = !driveOn; $("saveDrive").hidden = !driveOn;
    showMsg($("statusMsg"), note, "warn");
  }
  function renderFiles() {
    const ul = $("fileList"); ul.innerHTML = "";
    if (!files.length) { const li = document.createElement("li"); li.textContent = "見つかりませんでした。言葉を変えて探し直してください。"; ul.appendChild(li); return; }
    files.forEach((f) => {
      const li = document.createElement("li");
      const isBase = picked.base === f.id, isRef = picked.refs.includes(f.id);
      if (isBase || isRef) li.className = "on";
      li.innerHTML = `<div class="name"></div><div class="meta"><span></span>　<a target="_blank" rel="noopener">開く</a></div><div class="pick"><button type="button" data-r="base">元にする</button><button type="button" data-r="ref">参考</button></div>`;
      li.querySelector(".name").textContent = f.name;
      li.querySelector(".meta span").textContent = `${f.folder || "マイドライブ"}・${(f.modified || "").slice(0, 10)}`;
      li.querySelector("a").href = f.url;
      if (reasons[f.id] && (isBase || isRef)) { const r = document.createElement("div"); r.className = "meta"; r.textContent = "AIが選んだ理由：" + reasons[f.id]; li.querySelector(".meta").after(r); }
      const [bBase, bRef] = li.querySelectorAll(".pick button");
      bBase.setAttribute("aria-pressed", String(isBase)); bRef.setAttribute("aria-pressed", String(isRef));
      bBase.addEventListener("click", () => {
        picked.base = isBase ? null : f.id; picked.refs = picked.refs.filter((x) => x !== f.id); renderFiles();
      });
      bRef.addEventListener("click", () => {
        if (isRef) picked.refs = picked.refs.filter((x) => x !== f.id);
        else if (picked.refs.length >= 4) return alert("「参考」は4つまで選べます。");
        else { picked.refs.push(f.id); if (picked.base === f.id) picked.base = null; }
        renderFiles();
      });
      ul.appendChild(li);
    });
  }
  async function search(btn, body) {
    showMsg($("searchMsg"), "");
    busy(btn, true, "探しています…");
    try {
      const res = await api("/api/search", body);
      const data = await res.json();
      $("keywords").value = (data.keywords || []).join("　");
      files = data.files || []; picked.base = null; picked.refs = []; reasons = {};
      $("results").hidden = false; renderFiles();
    } catch (e) { showMsg($("searchMsg"), e.message); }
    finally { busy(btn, false); }
  }
  $("searchBtn").addEventListener("click", () => {
    const request = $("request").value.trim();
    if (!request) return showMsg($("searchMsg"), "先に頼みたいことを入力してください。");
    search($("searchBtn"), { request });
  });
  $("researchBtn").addEventListener("click", () => {
    const keywords = $("keywords").value.split(/[\s　、,]+/).filter(Boolean);
    if (!keywords.length) return;
    search($("researchBtn"), { keywords });
  });

  // ---- 記の項目 ----
  function renderItems() {
    const box = $("items"); box.innerHTML = "";
    items.forEach((it, i) => {
      const el = document.createElement("div"); el.className = "item";
      el.innerHTML = `<div class="item-head"><span>${zen(i + 1)}</span><input aria-label="見出し"><button type="button">削除</button></div><textarea rows="2" aria-label="内容" style="margin-top:8px;min-height:60px"></textarea>`;
      const [head, del] = [el.querySelector("input"), el.querySelector("button")];
      const ta = el.querySelector("textarea");
      head.value = it.heading; ta.value = it.lines;
      head.addEventListener("input", () => { it.heading = head.value; render(); });
      ta.addEventListener("input", () => { it.lines = ta.value; render(); });
      del.addEventListener("click", () => { items.splice(i, 1); renderItems(); render(); });
      box.appendChild(el);
    });
  }
  $("addItem").addEventListener("click", () => { items.push({ heading: "", lines: "" }); renderItems(); render(); });

  // ---- 文書データとプレビュー ----
  function docData() {
    const d = currentDraft();
    const contact = { office: $("cOffice").value.trim(), person: $("cPerson").value.trim(), ext: $("cExt").value.trim() };
    if (kind === "matome") return { kind, date: $("date").value.trim(), sender: $("sender").value.trim(), ...d, contact };
    return {
      kind, docNumber: $("docNumber").value.trim(), date: $("date").value.trim(),
      recipient: $("recipient").value.trim(), sender: $("sender").value.trim(),
      title: d.title, body: d.body, items: d.items,
      closing: $("closing").checked ? "以上" : "",
      contact: { office: $("cOffice").value.trim(), person: $("cPerson").value.trim(), ext: $("cExt").value.trim() },
    };
  }
  function render() {
    if ($("editor").hidden) return;
    const d = docData(); const P = $("paper"); P.innerHTML = "";
    // Wordと同じく1行35字になるよう文字の大きさを合わせる
    P.style.fontSize = (P.clientWidth * 0.798 / 35) + "px";
    const add = (text = "", cls = "") => { const p = document.createElement("p"); if (cls) p.className = cls; p.textContent = text; P.appendChild(p); return p; };
    if (kind === "matome") {
      const t = add(d.title, "c"); t.style.fontWeight = "700"; t.style.fontSize = "1.15em"; add();
      if (d.date) add(d.date + "　", "r"); if (d.sender) add(d.sender + "　", "r"); add();
      if (d.points.length) {
        const box = document.createElement("div"); box.style.cssText = "border:1px solid #000;padding:.2em .4em";
        const h = document.createElement("p"); h.textContent = "この資料のポイント"; h.style.fontWeight = "700"; box.appendChild(h);
        d.points.forEach((x) => { const q = document.createElement("p"); q.textContent = "・" + x; q.style.cssText = "padding-left:1em;text-indent:-1em"; box.appendChild(q); });
        P.appendChild(box); add();
      }
      d.sections.forEach((sec, i) => {
        const h = add(`${zen(i + 1)}　${sec.heading}`); h.style.fontWeight = "700";
        sec.blocks.forEach((b) => {
          const q = b.type === "bullet" ? add((/^[①-⑳]/.test(b.text) ? "" : "・") + b.text) : add(b.text);
          q.style.cssText = b.type === "bullet" ? "padding-left:2em;text-indent:-1em" : "padding-left:1em;text-indent:1em";
        });
        add();
      });
      if (d.sources.length) { add("【出典】"); d.sources.forEach((x) => { const q = add("・" + x); q.style.cssText = "padding-left:2em;text-indent:-1em"; }); }
      P.style.aspectRatio = "auto"; P.style.minHeight = (P.clientWidth * 297 / 210) + "px";
      return;
    }
    P.style.aspectRatio = ""; P.style.minHeight = "";
    add(kind === "tsuchi" && d.docNumber ? d.docNumber + "　" : "事務連絡　", "r");
    add(d.date + "　", "r"); add();
    add(d.recipient, "i1"); add();
    add(d.sender + "　", "r"); add();
    add(d.title, "c"); add();
    d.body.forEach((t) => add(t, "i1"));
    const its = d.items.filter((it) => it.heading || it.lines.length);
    if (its.length) {
      add(); add("記", "c"); add();
      its.forEach((it, i) => { add(`${zen(i + 1)}　${it.heading}`); it.lines.forEach((l) => add(l, "i1")); add(); });
    } else add();
    if (d.closing) add("以上　", "r");
    const c = d.contact; const cl = [c.office && `事務局：${c.office}`, c.person && `担　当：${c.person}`, c.ext && `内　線：${c.ext}`].filter(Boolean);
    if (cl.length) { add(); add(); cl.forEach((l) => add(l, "contact")); }
  }
  ["docNumber", "date", "recipient", "sender", "title", "body", "mbody", "cOffice", "cPerson", "cExt", "closing"].forEach((id) => $(id).addEventListener("input", render));

  // ---- Word 保存 ----
  const fileName = (d) => `${kind === "tsuchi" ? "通知" : kind === "matome" ? "資料まとめ" : "事務連絡"}（${d.title.replace(/[\\/:*?"<>|]/g, "").slice(0, 40)}）.docx`;
  $("saveDrive").addEventListener("click", async () => {
    const d = docData();
    if (!d.title) return alert("件名を入力してください。");
    busy($("saveDrive"), true, "保存中…");
    try {
      const res = await api("/api/save", { name: fileName(d), doc: d });
      const saved = await res.json();
      const el = $("reviseMsg"); el.innerHTML = `<div class="msg info">ドライブの「${saved.folder}」フォルダに保存しました。<a target="_blank" rel="noopener">ドライブで開く</a></div>`;
      el.querySelector("a").href = saved.url;
      el.scrollIntoView({ behavior: "smooth", block: "center" });
    } catch (e) { alert(e.message); }
    finally { busy($("saveDrive"), false); }
  });
  $("saveDocx").addEventListener("click", async () => {
    const d = docData();
    if (!d.title) return alert("件名を入力してください。");
    busy($("saveDocx"), true, "Wordを作っています…");
    try {
      const res = await api("/api/docx", d);
      const blob = await res.blob();
      const name = fileName(d);
      const file = new File([blob], name, { type: blob.type });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try { await navigator.share({ files: [file], title: name }); return; }
        catch (e) { if (e.name === "AbortError") return; }
      }
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 10000);
    } catch (e) { alert(e.message); }
    finally { busy($("saveDocx"), false); }
  });

  window.addEventListener("resize", render);
  applyKind();
  checkStatus();
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
})();
</script>
</body>
</html>
