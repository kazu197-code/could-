<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>アプリ一覧</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* 各アプリへの入口。アプリを追加したら APPS に1行足す。 */
:root {
  --bg: #f4f1ea; --surface: #fffdf8; --line: #e2dccf; --fg: #2b2622; --muted: #7a7066; --accent: #2f7d6d;
  --font-display: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", sans-serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #161412; --surface: #211e1b; --line: #36312c; --fg: #efe9e2; --muted: #a79d92; --accent: #5cc0a8; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #161412; --surface: #211e1b; --line: #36312c; --fg: #efe9e2; --muted: #a79d92; --accent: #5cc0a8; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.6; }
.wrap { max-width: 640px; margin: 0 auto; padding: 32px 16px 48px; }
h1 { font-family: var(--font-display); font-size: 24px; margin: 0 0 4px; }
p.lead { color: var(--muted); margin: 0 0 20px; font-size: 14px; }
.apps { display: grid; gap: 12px; }
a.app { display: grid; grid-template-columns: 56px 1fr auto; gap: 14px; align-items: center; padding: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; color: inherit; text-decoration: none; }
a.app:active { transform: scale(.99); }
.ico { width: 56px; height: 56px; border-radius: 14px; display: grid; place-items: center; font-size: 28px; }
.name { font-family: var(--font-display); font-size: 17px; font-weight: 700; }
.desc { font-size: 13px; color: var(--muted); }
.arrow { color: var(--accent); font-size: 20px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>アプリ一覧</h1>
  <p class="lead">使いたいアプリを選んでください。</p>
  <nav class="apps">
    <a class="app" href="pet-health/">
      <span class="ico" style="background:#dcefe9">🐾</span>
      <span><span class="name">うちの子ノート</span><br><span class="desc">ペットの予定・通院・体重の記録</span></span>
      <span class="arrow" aria-hidden="true">›</span>
    </a>
    <a class="app" href="mahjong/">
      <span class="ico" style="background:#d7ebe0">🀄</span>
      <span><span class="name">麻雀 卓立てカレンダー</span><br><span class="desc">メンバー集めと卓の予定</span></span>
      <span class="arrow" aria-hidden="true">›</span>
    </a>
  </nav>
</div>
</body>
</html>
